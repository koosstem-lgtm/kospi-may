<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매매 컨트롤</title>
<style>
:root {
  --bg: #0d1117;
  --bg-card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --up: #f85149;
  --down: #4a9eff;
  --flat: #8b949e;
  --warn: #f0883e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 16px 16px 60px;
  -webkit-font-smoothing: antialiased;
}
.container { max-width: 1280px; margin: 0 auto; }

/* 탭 네비 */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.tabs .tab {
  padding: 12px 20px;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: 0.15s;
}
.tabs .tab:hover { color: var(--text); }
.tabs .tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 700;
}

header { margin-bottom: 20px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 16px; font-weight: 600; margin: 28px 0 12px; padding-left: 8px; border-left: 3px solid var(--accent); }
.meta { color: var(--text-dim); font-size: 13px; margin-top: 6px; }

.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--flat); }
.err { color: var(--warn); font-size: 12px; }

.btn {
  display: inline-block;
  padding: 10px 22px;
  background: var(--bg-card);
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  transition: 0.15s;
}
.btn:hover { background: rgba(88,166,255,0.08); border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn.primary:hover { background: #4894ec; color: white; }
.btn.danger { background: var(--up); color: white; border-color: var(--up); }
.btn.danger:hover { background: #e54339; color: white; }

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  font-size: 13px;
}
th, td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
th {
  background: rgba(88,166,255,0.05);
  font-weight: 600;
  font-size: 11px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
tr:last-child td { border-bottom: none; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.code { font-size: 11px; color: var(--text-dim); font-family: monospace; }
tbody tr:hover { background: rgba(88,166,255,0.04); }

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-dim);
  background: var(--bg-card);
  border: 1px dashed var(--border);
  border-radius: 10px;
  font-size: 14px;
}

@media (max-width: 800px) {
  body { padding: 12px 8px 40px; }
  table { font-size: 12px; }
  th, td { padding: 8px 6px; }
  .tabs .tab { padding: 10px 14px; font-size: 13px; }
}

.action-bar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.action-bar .btn { padding: 14px 24px; font-size: 14px; }
</style>
</head>
<body>
<div class="container">


<nav class="tabs">

</html>
